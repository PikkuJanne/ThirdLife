      type: equals
      value: uefi
    decision:
      blocks_ready: true
      unmet_disposition: alternative_operating_system_candidate
      unavailable_disposition: human_review_required
  - id: POL-SECUREBOOT-001
    requirement_type: blocking
    severity: critical
    evidence_key: secure_boot.capable
    condition:
      type: equals
      value: true
    decision:
      blocks_ready: true
      unmet_disposition: repair_and_retest
      unavailable_disposition: human_review_required
  - id: POL-SECUREBOOT-002
    requirement_type: repairable
    severity: required
    evidence_key: secure_boot.enabled
    condition:
