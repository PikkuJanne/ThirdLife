  objective: Provide a recipient-present, basic operating-system backup onboarding workflow using supported mechanisms, destination
    checks, a harmless restore test, and clear recovery ownership without building a backup engine.
  deliverables:
  - backup onboarding domain and state model
  - supported operating-system backup/status adapter selected by ADR
  - destination/capacity and recovery-ownership checks
  - initial backup and harmless restore-test workflow where supported
  - sealed-handover pending state and recipient instructions
  - tests, journal, verification, and privacy controls
  acceptance_criteria:
  - ThirdLife does not implement cryptography, a repository format, or a general backup engine.
  - The present recipient or authorized organization selects the destination and controls credentials/recovery material.
  - Destination capacity and supported prerequisites are checked before configuration.
  - Backup is not reported configured until a representative harmless file has been restored successfully; unsupported or
    deferred paths remain explicit.
  - Sealed handover creates no recipient account, key, credential, or backup job and reports backup onboarding as pending.
  - Recovery material never enters ordinary logs, reports, support bundles, ThirdLife metadata, or future suite metadata.
  - Backup Circle is not invoked, configured, or treated as a dependency.
  verification:
  - Run deterministic supported, unavailable, insufficient-space, credential-denied, interrupted, failed-backup, failed-restore,
    successful-restore, and sealed-handover tests.
  - Perform a recipient/proxy restore workflow on the active Codex machine using a safe organization-controlled test destination,
    disposable virtual disk, or isolated local test destination; no second computer is required.
  evidence: []
  human_evidence_required:
  - A recipient/proxy completes a supported backup and harmless restore test or records a truthful unsupported/pending outcome.
  - Security/privacy owner confirms recovery-material isolation.
  expected_test_tier: targeted
  full_test_triggers:
  - Run the full tier when this task changes a data/migration, privilege, package/update, installer/lifecycle, backup, or
    security boundary.
  extended_test_triggers:
  - Run the relevant extended scenario for interruption, resource pressure, adversarial input, cold boot, endurance, or restore
    risk affected by the task.
