  - structured execution progress events
  - cancellation and timeout policy
  - network-loss failure classification
  - operator recovery guidance
  acceptance_criteria:
  - Progress is correlated to one journaled action and is accessible to assistive technology.
  - Cancellation is attempted only where the backend supports it and the resulting state is never misreported.
  - Timeout does not imply rollback or success; the action enters a reviewable recoverable state.
  - Network loss preserves the job and resolved approval data while requiring a safe retry decision.
  - No raw package URL or sensitive backend stream is emitted to normal logs.
  verification:
  - Inject cancellation, timeout, network loss, and UI termination during package operations.
  - Confirm the journal and UI distinguish failed, cancelled/review-required, and verified outcomes.
