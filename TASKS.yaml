    candidate identity evidence to resolve the mismatch. Bind outcome assertions to the tested build.
  - Drive the actual launched route through normal UI input and verify persisted manual results and reopened report agreement.
    Verify blocked sanitization, cancellation/recovery, and unelevated operation on the applicable routes.
  - Investigate speech and scrolling through available technical checks. Record what the correction resolves, preserve
    any unresolved reported defect, and state validation limits accurately.
  - Run applicable Quick/Targeted checks, the documented active-machine Full gate in a clean same-machine environment,
    and bundle validation. Inspect logs, database, temporary paths, and reports for prohibited data and unsupported claims.
