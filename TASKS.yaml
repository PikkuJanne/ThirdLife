  - quick
  - targeted
  - full
  - extended
authority:
  precedence:
  - DECISIONS.md
  - ROADMAP.md
  - PROJECT_BOUNDARY.md
  - SECURITY.md
  - ACCESSIBILITY.md
  - LOW_SPEC.md
  - DEVELOPMENT_WORKFLOW.md
  - TESTING.md
  - AGENTS.md
  - TASKS.yaml
  - STATUS.md
  - CODEX_START_PROMPT.md
  - README.md
  change_rule: Frozen decisions, project boundaries, portfolio posture, and milestone scope require explicit human approval.
    Codex may update only task execution fields unless the selected task explicitly authorizes a synchronized bundle change.
workflow:
  states:
  - backlog
  - ready
  - in_progress
  - blocked
  - review
  - done
  - cancelled
  allowed_transitions:
    backlog:
    - ready
    - cancelled
    ready:
    - in_progress
    - blocked
    - cancelled
    in_progress:
    - blocked
    - review
    - ready
    blocked:
    - ready
    - cancelled
    review:
    - in_progress
    - done
    - blocked
    done: []
    cancelled: []
  mutable_task_fields:
  - status
  - evidence
  - blocked_reason
  ready_rule: A task is dependency-ready when every depends_on task is done. It is Codex-ready when dependency-ready, status
    is ready or backlog, executor is codex or hybrid, required human input is already available, and the task can be verified
    on the active Codex machine or by deterministic fixtures without requiring another physical machine.
  selection_rule: Select the lowest milestone, then lowest numeric task ID, among Codex-ready P0 tasks unless the user names
    a task.
  single_task_default: true
  human_completion_rule: 'Codex must not mark executor: human tasks done. For executor: hybrid tasks, Codex may complete implementation
    but must leave status at review or blocked until every human_evidence_required item is attached.'
definition_of_ready:
- All dependencies are done.
- Relevant frozen decisions, STATUS.md, TESTING.md, DEVELOPMENT_WORKFLOW.md, and project-boundary rules have been read.
- Deliverables and acceptance criteria are testable on the active Codex machine or with deterministic synthetic/captured fixtures.
- Required Windows, package, policy, or human inputs are available; no task may require a second physical computer, hardware
  lab, external runner matrix, or lower-performance test device.
- The expected test tier and any full/extended triggers are explicit.
- No unresolved blocker or contradictory authority exists.
- The task has no live dependency on a sibling repository, database, service, branch, build, or unfinished feature.
definition_of_done:
- Every listed deliverable is present or the task record explains an approved replacement.
- Every acceptance criterion is satisfied by linked evidence.
- The selected quick/targeted/full/extended verification scope passes on the active Codex machine, and broader tiers are run
  only when a documented trigger applies.
- Each reproducible defect is reduced to the smallest practical deterministic regression case; slow scenarios are independently
  invokable and checkpointed.
- Required Windows/manual/human evidence is attached without implying a multi-hardware certification.
- Security, privacy, accessibility, modest-hardware design, migration, release-interface, and documentation impacts are addressed
  where applicable.
- The implementation remains independently useful without sibling applications and does not introduce a cross-project dependency.
- TASKS.yaml status/evidence is updated without rewriting frozen history; STATUS.md, branch, commit, push, and clean-tree
  state support continuation from GitHub.
milestones:
- id: M0
  name: Foundation and product contract
  objective: Create the governed repository, frozen standalone and portfolio boundaries, security/privacy/accessibility/modest-hardware
    baselines, pilot inputs, GitHub continuity, and a tiered same-machine verification system before feature code expands.
  gate_task: TL-0010
  exit_criteria:
  - The repository builds from a clean checkout on the supported Windows environment on the active Codex machine.
  - Product, non-goals, threat, privacy, accessibility, modest-hardware design, dependency/licence, reference-machine profile,
    test-tier, and ADR inputs have named owners.
  - No lab, physical-device pool, lower-performance test machine, external runtime matrix, or missing equipment is a project
    dependency or release blocker.
  - The Team B/B1 project-vacuum boundary and future B4 late-binding posture are explicit and validated.
  - The roadmap bundle, GitHub workflow, task graph, and repository rules are internally consistent and validated.
- id: M1
  name: Audit-only vertical slice
  objective: Create a durable local job, enforce sanitization evidence, run a read-only assessment, capture guided human-test
    states, and produce a privacy-safe workshop report using deterministic fixtures and the active Codex machine.
  gate_task: TL-0116
  exit_criteria:
  - The normal flow makes no system changes and runs unelevated.
  - Missing evidence remains unknown and normalized observations are deterministic across synthetic/captured fixtures and
    the active machine.
  - A representative operator completes the available workflow on the active Codex machine; unavailable hardware capabilities
    are handled truthfully and exercised through deterministic states.
  - No claim of broad hardware coverage or certification is made.
- id: M2
  name: Explainable disposition engine
  objective: Evaluate versioned organization policy against immutable evidence and produce explainable dispositions, confirmations,
    repairs, and governed exceptions.
  gate_task: TL-0208
  exit_criteria:
  - Every disposition cites evidence and policy.
  - Blocking failures cannot silently pass; exceptions remain attributable and visible.
  - Historical jobs preserve the policy/result originally used.
- id: M3
  name: Safe planning and privilege boundary
  objective: Resolve declarative profiles into a complete approved plan and prove that a narrow ephemeral broker independently
    rejects anything outside compiled actions.
  gate_task: TL-0314
  exit_criteria:
  - Profiles/catalog entries cannot execute arbitrary commands.
  - Approval binds resolved content and material changes require reapproval.
  - The broker protocol, IPC, journal, and reboot checkpoints fail closed under adversarial tests.
- id: M4
  name: One package installation vertical slice
  objective: Install and independently verify one approved machine-wide package through the structured backend, broker, journal,
    recovery, and reporting path.
  gate_task: TL-0411
  exit_criteria:
  - Exact package identity/source/trust data is enforced without localized table parsing or hash bypass.
  - Installer success is not accepted until independent verification passes.
  - UAC decline, network loss, process termination, reboot, and retry are recoverable and idempotent.
- id: M5
  name: Full machine profile
  objective: Apply the reviewed pilot profile across Windows Update, multiple packages, security checks, restart phases, cold-boot
    verification on the active Codex machine, and risk-relevant same-machine constrained scenarios.
  gate_task: TL-0511
  exit_criteria:
  - The job-seeker machine profile converges on supported clean Windows environments hosted on the active Codex machine.
  - Essential failures and resource or ownership blockers prevent ready status.
  - Same-machine offline, low-space, no-GPU, reduced-concurrency, interruption, and failure scenarios preserve state and recovery.
  - Final cold-boot verification on the active Codex machine records exact versions and unresolved limitations.
  - Evidence describes the reference machine and constraints and does not imply a cross-hardware certification.
- id: M6
  name: Handover and controlled pilot
  objective: Block handover until finalization, reports, diagnostic privacy, accessibility, security/privacy review, packaging,
    and human go/no-go approvals support a controlled v0.1 pilot; this is not the standalone stable-release or Team B exit
    gate.
  gate_task: TL-0611
  exit_criteria:
  - Workshop, recipient, and diagnostic outputs respect their distinct data boundaries.
  - Finalization and sign-off cannot be bypassed while blockers remain.
  - The reproducible pilot package, runbook, audits, and named human approvals support a controlled partner pilot.
  - The gate record states that Core 1.0 completion and portfolio handoff remain in M7.
- id: M7
  name: Core 1.0 standalone release and portfolio handoff
  objective: Complete recipient-controlled accessibility and basic operating-system backup onboarding, harden the standalone
    product lifecycle, publish the minimal release interface, freeze exact release artifacts, and prove ThirdLife Setup Core
    1.0 is independently releasable.
  gate_task: TL-0710
  exit_criteria:
  - ThirdLife Setup Core is useful, installable, updateable, repairable, removable, and recoverable without sibling applications,
    a ThirdLife account, or a permanent privileged service.
  - Recipient accessibility and basic operating-system backup choices remain recipient-controlled, reversible where applicable,
    and do not leak recovery material.
  - Offline core behavior, same-machine modest-hardware evidence, security/privacy, accessibility, update, repair, uninstall,
    migration, and data-preservation evidence pass the stable-release matrix.
  - Exact artifacts, hashes, source revision, SBOM, licence evidence, known limitations, sanitized samples, and RELEASE_INTERFACE.md
    are frozen.
  - Release wording distinguishes design intent and active-machine observations from unperformed cross-hardware certification.
  - Team B/B1 is complete and the next project is Scam Explainer; no B4 sibling adapter work is authorized by this gate.
