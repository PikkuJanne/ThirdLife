  - Offered executable/fixture launcher outcome regression and reported-defect dispositions
  acceptance_criteria:
  - The offered executable/fixture launcher starts in an untouched isolated state. Ordinary UI input creates a job, confirms
    and saves intake, enables Start assessment, completes read-only assessment, persists a manual result across close/reopen,
    and produces a matching report.
  - Missing, failed, or unsaved sanitization blocks assessment. Synthetic sanitization is paired only with isolated providers
    and cannot authorize real collection on an unsanitized host.
  - The normal flow is unelevated and performs no system-changing action. Identical observations produce identical normalized
    evidence, and missing evidence remains unknown.
  - Jobs survive process termination and reopen. Normal logs, storage, temporary output, and reports stay inside their
    privacy boundaries.
  - Applicable technical accessibility checks cover keyboard, focus, accessibility tree and speech-related signals, display,
    and scrolling. Known defects in required supported workflows block completion.
  - The gate scopes physical, perceptual, and hardware claims to the evidence and records completion as an audit-only
    internal development baseline.
