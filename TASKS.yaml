  acceptance_criteria:
  - Each test records Pass, Fail, Not run, or Not available with operator, timestamp, notes, evidence class and the required
    unavailable reason. Not run is the canonical meaning of the earlier wording not tested.
  - Detected presence does not automatically pass a functional test.
  - The workflow can pause and resume without rewriting completed evidence.
  - No test starts destructive stress, changes firmware/security ownership controls, or writes unknown removable media.
  - Instructions are usable without a mouse and not color-dependent.
  - All state transitions and capability-absent/equipment-unavailable paths are deterministically testable without possessing
    each hardware class.
