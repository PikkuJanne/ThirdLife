  - blocked
  - review
  - done
  - cancelled
  selection_rule: Select implementation-ready work within the assigned outcome. Prefer ready work and use priority and ID
    as tie-breakers.
  prerequisite_rule: Check capability evidence and action authorization before the scoped execution or release. Candidate
    engineering may proceed independently. Across M0-M7, release maintenance and future tasks, use only the active Codex
    machine and its one existing ThirdLife-W11 Windows 11 guest. An unavailable test condition affects only its scenario
    and associated claim; it cannot create a second-guest, alternative-baseline or licensing prerequisite for development.
definition_of_ready:
- Every actual implementation dependency is done.
- The next engineering step is verifiable on the active machine or with appropriate deterministic fixtures.
- The task records what requires execution qualification or exposure authorization. An unavailable external condition
  is not an implementation dependency; finish the available engineering and continue other implementation-ready work.
definition_of_done:
- Evidence meets the task's defined outcome, verification tier, criteria and scoped prerequisites.
- Record blocked or unavailable capability without claiming unobserved success.
- Keep ordinary engineering complete through objective verification. Scope actual decisions to the affected action or exposure.
- Update task evidence and synchronize the verified changes through GitHub.
milestones:
- id: M0
  name: Foundation and product contract
  objective: Create the governed repository, frozen standalone and portfolio boundaries, security/privacy/accessibility/modest-hardware
    baselines, pilot inputs, GitHub continuity, and a tiered same-machine verification system before feature code expands.
  gate_task: TL-0010
  exit_criteria:
  - The repository builds from a clean checkout on the supported Windows environment on the active Codex machine.
  - Product, non-goals, threat, privacy, accessibility, modest-hardware design, dependency/licence, reference-machine
    profile, test-tier, and ADR inputs have named owners.
  - No lab, physical-device pool, lower-performance test machine, external runtime matrix, or missing equipment is a project
    dependency or release blocker.
  - The Team B/B1 project-vacuum boundary and future B4 late-binding posture are explicit and validated.
  - The roadmap bundle, GitHub workflow, task graph, and repository rules are internally consistent and validated.
- id: M1
  name: Audit-only vertical slice
  objective: Establish a verified audit-only internal development baseline on the active Codex machine.
  gate_task: TL-0116
  exit_criteria:
  - The normal flow makes no system changes and runs unelevated.
  - Missing evidence remains unknown and normalized observations are deterministic across the tested synthetic/captured
    fixtures and active-machine environments.
  - The offered executable/fixture launcher verifies fresh job creation, confirmed and saved sanitization intake, enabled
    Start assessment, completed read-only assessment, manual capture, durable close/reopen and report agreement through
    ordinary UI input.
  - Applicable technical accessibility and privacy checks pass. Known defects in required supported workflows are resolved,
    prior failures retain their provenance, and perceptual and physical validation limits are stated.
  - The Full and bundle gates pass. Claims are limited to the audit-only internal development baseline and its actual
    test scope.
- id: M2
  name: Explainable disposition engine
  objective: Evaluate versioned organization policy against immutable evidence and produce explainable dispositions, confirmations,
    repairs, and governed exceptions.
  gate_task: TL-0208
  exit_criteria:
  - Every disposition cites evidence and policy.
  - Blocking failures cannot silently pass; exceptions remain attributable and visible.
  - Historical jobs preserve the policy/result originally used.
  - New or materially changed wording and exception governance have an attributable policy-owner decision before adoption.
- id: M3
  name: Safe planning and privilege boundary
  objective: Resolve declarative profiles into an approved plan and qualify compiled, isolated privilege routes for their
    own capabilities.
  gate_task: TL-0314
  exit_criteria:
  - Profiles/catalog entries cannot execute arbitrary commands.
  - Approval binds resolved content and material changes require reapproval.
  - The broker protocol, IPC, journal, and reboot checkpoints fail closed under adversarial tests.
  - The prepared privilege-boundary candidate has one attributable scope-bound security authorization.
- id: M4
  name: One package installation vertical slice
  objective: Install and independently verify an approved machine-wide package through a supported backend and the plan, journal,
    recovery and reporting path.
  gate_task: TL-0411
  exit_criteria:
  - Exact package identity/source/trust data is enforced without localized table parsing or hash bypass.
  - Installer success is not accepted until independent verification passes.
  - UAC decline, network loss, process termination, reboot, and retry are recoverable and idempotent.
  - One attributable first write-capable product/security decision records the verified candidate and its authorized release
    scope.
- id: M5
  name: Full machine profile
  objective: Verify the reviewed pilot profile across Windows Update, packages, security checks, restart phases, and cold-start
    and constrained scenarios hosted on the active Codex machine.
  gate_task: TL-0511
  exit_criteria:
  - The job-seeker machine profile converges in the verified Windows 11 client/native-x64 state of the one existing
    ThirdLife-W11 guest. Clean and upgraded test states run sequentially in that guest; no extra Windows instance is required.
  - Essential failures and resource or ownership blockers prevent ready status.
  - Same-machine offline, low-space, no-GPU, reduced-concurrency, interruption, and failure scenarios preserve state and
    recovery.
  - Final checkpoint and cold-start verification identify exact versions and environment. VM evidence is scoped to the
    tested VM. Any required physical release condition remains explicit.
  - The technical gate records unresolved blockers, physical and perceptual limits, reference environments, and constraints.
    Pilot scope decisions occur at TL-0611.
- id: M6
  name: Handover and controlled pilot
  objective: Verify handover behavior and the pilot candidate, then obtain actual accountable controlled-pilot decisions
    before exposure. Standalone stable release and Team B transition remain in M7.
  gate_task: TL-0611
  exit_criteria:
  - Workshop, recipient, and diagnostic outputs respect their distinct data boundaries.
  - Finalization and product operator sign-off cannot be bypassed while blockers remain.
  - TL-0610 verifies the reproducible Windows 11 client/native-x64 pilot candidate, lifecycle, runbook, and audit evidence. TL-0611 records
    the actual controlled-pilot go/no-go, accountable dispositions, and partner acceptance before exposure.
  - The gate record states that Core 1.0 completion and portfolio handoff remain in M7.
- id: M7
  name: Core 1.0 standalone release and portfolio handoff
  objective: Complete recipient-controlled accessibility and basic operating-system backup onboarding, harden the standalone
    product lifecycle, publish the minimal release interface, freeze exact release artifacts, and prove ThirdLife Setup
    Core 1.0 is independently releasable.
  gate_task: TL-0710
  exit_criteria:
  - ThirdLife Setup Core is useful, installable, updateable, repairable, removable, and recoverable without sibling applications,
    a ThirdLife account, or a permanent privileged service.
  - Recipient accessibility and basic operating-system backup choices remain recipient-controlled, reversible where applicable,
    and do not leak recovery material.
  - Offline core behavior, same-machine modest-hardware evidence, security/privacy, accessibility, update, repair, uninstall,
    migration, and data-preservation evidence pass the Windows 11 client/native-x64 stable-release matrix.
  - Exact artifacts, hashes, source revision, SBOM, licence evidence, known limitations, sanitized samples, and RELEASE_INTERFACE.md
    are frozen.
  - Release wording distinguishes design intent and active-machine observations from unperformed cross-hardware certification.
  - TL-0710 records actual go/no-go and accountable scope dispositions on the exact candidate and required pilot evidence.
    Technical development uses TL-0610 for TL-0701 and TL-0702. Controlled-pilot exposure and the stable gate still require
    TL-0611.
  - Team B/B1 is complete and the next project is Scam Explainer; no B4 sibling adapter work is authorized by this gate.
