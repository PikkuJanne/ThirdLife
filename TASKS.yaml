schema_version: 1
bundle_version: 0.2.0
generated_on: '2026-08-14'
project:
  name: ThirdLife
  component: ThirdLife Setup Core
  owner_team: Team B
  queue_position: B1
  release_target: ThirdLife Setup Core 1.0 standalone stable release
  pilot_gate: TL-0611
  standalone_release_gate: TL-0710
  future_assembly_project: ThirdLife Deployment and Suite Assembly
  future_assembly_queue_position: B4
  platform: Windows 11 x64
  stack:
  - .NET 10
  - C#
  - WPF
  - SQLite
  repository_root: .
authority:
  precedence:
  - DECISIONS.md
  - ROADMAP.md
  - PROJECT_BOUNDARY.md
  - SECURITY.md
  - ACCESSIBILITY.md
  - LOW_SPEC.md
  - AGENTS.md
  - TASKS.yaml
  - CODEX_START_PROMPT.md
  - README.md
  change_rule: Frozen decisions, project boundaries, portfolio posture, and milestone scope require explicit human approval.
    Codex may update only task execution fields unless the selected task explicitly authorizes a synchronized bundle change.
workflow:
  states:
  - backlog
  - ready
  - in_progress
  - blocked
  - review
  - done
  - cancelled
  allowed_transitions:
    backlog:
    - ready
    - cancelled
    ready:
    - in_progress
    - blocked
    - cancelled
    in_progress:
    - blocked
    - review
    - ready
    blocked:
    - ready
    - cancelled
    review:
    - in_progress
    - done
    - blocked
    done: []
    cancelled: []
  mutable_task_fields:
  - status
  - evidence
  - blocked_reason
  ready_rule: A task is dependency-ready when every depends_on task is done. It is Codex-ready when dependency-ready, status
    is ready or backlog, executor is codex or hybrid, and any required human input is already available.
  selection_rule: Select the lowest milestone, then lowest numeric task ID, among Codex-ready P0 tasks unless the user names
    a task.
  single_task_default: true
  human_completion_rule: 'Codex must not mark executor: human tasks done. For executor: hybrid tasks, Codex may complete implementation
    but must leave status at review or blocked until every human_evidence_required item is attached.'
definition_of_ready:
- All dependencies are done.
- Relevant frozen decisions and project-boundary rules have been read.
- Deliverables and acceptance criteria are testable.
- Required Windows, hardware, package, policy, or human inputs are available, or the task is explicitly limited to a portable
  portion.
- No unresolved blocker or contradictory authority exists.
- The task has no live dependency on a sibling repository, database, service, branch, build, or unfinished feature.
definition_of_done:
- Every listed deliverable is present or the task record explains an approved replacement.
- Every acceptance criterion is satisfied by linked evidence.
- Automated verification passes at the required scope.
- Required Windows/manual/human evidence is attached.
- Security, privacy, accessibility, low-spec, migration, release-interface, and documentation impacts are addressed where
  applicable.
- The implementation remains independently useful without sibling applications and does not introduce a cross-project dependency.
- TASKS.yaml status/evidence is updated without rewriting frozen history.
milestones:
- id: M0
  name: Foundation and product contract
  objective: Create the governed repository, frozen standalone and portfolio boundaries, security/privacy/accessibility/low-spec
    baselines, pilot inputs, and verification infrastructure required before feature code expands.
  gate_task: TL-0010
  exit_criteria:
  - The repository builds from a clean checkout on the supported Windows environment.
  - Product, non-goals, threat, privacy, accessibility, low-spec, dependency/license, test-device, and ADR inputs have named
    owners.
  - The Team B/B1 project-vacuum boundary and future B4 late-binding posture are explicit and validated.
  - The roadmap bundle and repository rules are internally consistent and validated.
- id: M1
  name: Audit-only vertical slice
  objective: Create a durable local job, enforce sanitization evidence, run a read-only assessment, collect human tests, and
    produce a privacy-safe workshop report.
  gate_task: TL-0116
  exit_criteria:
  - The normal flow makes no system changes and runs unelevated.
  - Missing evidence remains unknown and normalized observations are deterministic.
  - A representative volunteer completes the flow with accessible UI and privacy-safe persistence/logging.
- id: M2
  name: Explainable disposition engine
  objective: Evaluate versioned organization policy against immutable evidence and produce explainable dispositions, confirmations,
    repairs, and governed exceptions.
  gate_task: TL-0208
  exit_criteria:
  - Every disposition cites evidence and policy.
  - Blocking failures cannot silently pass; exceptions remain attributable and visible.
  - Historical jobs preserve the policy/result originally used.
- id: M3
  name: Safe planning and privilege boundary
  objective: Resolve declarative profiles into a complete approved plan and prove that a narrow ephemeral broker independently
    rejects anything outside compiled actions.
  gate_task: TL-0314
  exit_criteria:
  - Profiles/catalog entries cannot execute arbitrary commands.
  - Approval binds resolved content and material changes require reapproval.
  - The broker protocol, IPC, journal, and reboot checkpoints fail closed under adversarial tests.
- id: M4
  name: One package installation vertical slice
  objective: Install and independently verify one approved machine-wide package through the structured backend, broker, journal,
    recovery, and reporting path.
  gate_task: TL-0411
  exit_criteria:
  - Exact package identity/source/trust data is enforced without localized table parsing or hash bypass.
  - Installer success is not accepted until independent verification passes.
  - UAC decline, network loss, process termination, reboot, and retry are recoverable and idempotent.
- id: M5
  name: Full machine profile
  objective: Apply the reviewed pilot profile across Windows Update, multiple packages, security checks, restart phases, cold-boot
    verification, and the supported test matrix.
  gate_task: TL-0511
  exit_criteria:
  - The job-seeker machine profile converges on the approved Windows/device matrix.
  - Essential failures and resource or ownership blockers prevent ready status.
  - Final cold-boot verification records exact versions and unresolved limitations.
- id: M6
  name: Handover and controlled pilot
  objective: Block handover until finalization, reports, diagnostic privacy, accessibility, security/privacy review, packaging,
    and human go/no-go approvals support a controlled v0.1 pilot; this is not the standalone stable-release or Team B exit
    gate.
  gate_task: TL-0611
  exit_criteria:
  - Workshop, recipient, and diagnostic outputs respect their distinct data boundaries.
  - Finalization and sign-off cannot be bypassed while blockers remain.
  - The reproducible pilot package, runbook, audits, and named human approvals support a controlled partner pilot.
  - The gate record states that Core 1.0 completion and portfolio handoff remain in M7.
- id: M7
  name: Core 1.0 standalone release and portfolio handoff
  objective: Complete recipient-controlled accessibility and basic operating-system backup onboarding, harden the standalone
    product lifecycle, publish the minimal release interface, freeze exact release artifacts, and prove ThirdLife Setup Core
    1.0 is independently releasable.
  gate_task: TL-0710
  exit_criteria:
  - ThirdLife Setup Core is useful, installable, updateable, repairable, removable, and recoverable without sibling applications,
    a ThirdLife account, or a permanent privileged service.
  - Recipient accessibility and basic operating-system backup choices remain recipient-controlled, reversible where applicable,
    and do not leak recovery material.
  - Offline core behavior, low-spec evidence, security/privacy, accessibility, update, repair, uninstall, migration, and data-preservation
    evidence pass the stable-release matrix.
  - Exact artifacts, hashes, source revision, SBOM, licence evidence, known limitations, sanitized samples, and RELEASE_INTERFACE.md
    are frozen.
  - Team B/B1 is complete and the next project is Scam Explainer; no B4 sibling adapter work is authorized by this gate.
