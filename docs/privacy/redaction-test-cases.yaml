      prohibited_literals_absent: [SYNTHETIC-HOSTNAME-DO-NOT-USE]
      required_literals_present: []
    rationale: Host and domain names are unnecessary in ordinary diagnostics.
    decision_refs: [D-014, D-037]
    tags: [negative, network, host]

  - id: PRV-017
    categories: [personal_path]
    sink: ordinary_log
    input:
      kind: path
      value: C:\Users\SYNTHETIC_RECIPIENT\Documents\SYNTHETIC_FILE.txt
    expectation:
      decision: replace
      output:
        event_code: PERSONAL_PATH_REJECTED
        outcome: RequiresReview
        result_code: PROHIBITED_FIELD_DROPPED
        redaction_flags: [ValueDropped]
      stable_code: PRV_REDACTED_DRIVE_PATH
      prohibited_literals_absent: [SYNTHETIC_RECIPIENT, SYNTHETIC_FILE.txt]
      required_literals_present: [PERSONAL_PATH_REJECTED, PROHIBITED_FIELD_DROPPED, ValueDropped]
    rationale: Drive paths produce only a closed diagnostic event and stable result code.
    decision_refs: [D-014, D-037]
    tags: [negative, path, windows]

  - id: PRV-018
    categories: [network_path, personal_path]
    sink: support_export
    input:
      kind: path
      value: \\SYNTHETIC-SERVER.invalid\SYNTHETIC-SHARE\SYNTHETIC_FILE.txt
    expectation:
      decision: drop
      output: null
      stable_code: PRV_REDACTED_UNC_PATH
      prohibited_literals_absent: [SYNTHETIC-SERVER.invalid, SYNTHETIC-SHARE, SYNTHETIC_FILE.txt]
      required_literals_present: []
    rationale: A UNC path can disclose server, share and filename information and has no support field.
    decision_refs: [D-014, D-037]
    tags: [negative, path, unc, support]

  - id: PRV-019
    categories: [file_uri, personal_path]
    sink: local_crash
    input:
      kind: url
      value: file:///C:/Users/SYNTHETIC_RECIPIENT/SYNTHETIC_CRASH.txt
    expectation:
      decision: reject
      output: null
      stable_code: PRV_REJECTED_FILE_URI_CRASH_SINK
      prohibited_literals_absent: [SYNTHETIC_RECIPIENT, SYNTHETIC_CRASH.txt]
      required_literals_present: []
    rationale: File URIs are rejected and no production crash sink accepts an event.
    decision_refs: [D-014, D-037]
    tags: [negative, path, file_uri, crash]

  - id: PRV-020
    categories: [environment_path, personal_path]
    sink: ordinary_log
    input:
      kind: text
      value: "%USERPROFILE%\\SYNTHETIC_PRIVATE_FILE.txt"
    expectation:
      decision: replace
      output:
        event_code: ENVIRONMENT_PATH_REJECTED
        outcome: RequiresReview
        result_code: PROHIBITED_FIELD_DROPPED
        redaction_flags: [ValueDropped]
      stable_code: PRV_REDACTED_ENVIRONMENT_PATH
      prohibited_literals_absent: [USERPROFILE, SYNTHETIC_PRIVATE_FILE.txt]
      required_literals_present: [ENVIRONMENT_PATH_REJECTED, PROHIBITED_FIELD_DROPPED, ValueDropped]
    rationale: Environment-based paths produce only a closed diagnostic event and stable result code.
    decision_refs: [D-014, D-037]
    tags: [negative, path, environment]

  - id: PRV-021
    categories: [package_download_url, url_token]
    sink: support_export
    input:
      kind: url
      value: https://packages.example.invalid/SYNTHETIC_PACKAGE.exe?token=SYNTHETIC_TOKEN_DO_NOT_USE#SYNTHETIC_FRAGMENT
    expectation:
      decision: drop
      output: null
      stable_code: PRV_DROPPED_TOKENIZED_PACKAGE_URL
      prohibited_literals_absent: [packages.example.invalid, SYNTHETIC_TOKEN_DO_NOT_USE, SYNTHETIC_FRAGMENT]
      required_literals_present: []
    rationale: Support uses an approved source alias and package ID, never a tokenized download URL.
    decision_refs: [D-037]
    tags: [negative, url, token, package, support]

  - id: PRV-022
    categories: [url_credential, password]
    sink: ordinary_log
    input:
      kind: url
      value: https://SYNTHETIC_USER:SYNTHETIC_PASSWORD_DO_NOT_USE@example.invalid/SYNTHETIC_RESOURCE
    expectation:
      decision: reject
      output: null
      stable_code: PRV_REJECTED_URL_CREDENTIAL
      prohibited_literals_absent: [SYNTHETIC_USER, SYNTHETIC_PASSWORD_DO_NOT_USE, SYNTHETIC_RESOURCE]
      required_literals_present: []
    rationale: A URL containing user information is rejected rather than partially logged.
    decision_refs: [D-037]
    tags: [negative, url, credential, log]

  - id: PRV-023
    categories: [package_download_url]
    sink: ordinary_log
    input:
      kind: structured_field
      value:
        field: package_download_url
        value: https://packages.example.invalid/SYNTHETIC_PUBLIC_PACKAGE.exe
    expectation:
      decision: replace
      output:
        event_code: PACKAGE_SOURCE_RESOLVED
        outcome: Completed
        result_code: SOURCE_ALIAS_RECORDED
        redaction_flags: [ValueDropped]
      stable_code: PRV_REPLACED_PACKAGE_URL_WITH_ALIAS
      prohibited_literals_absent: [packages.example.invalid, SYNTHETIC_PUBLIC_PACKAGE.exe]
      required_literals_present: [PACKAGE_SOURCE_RESOLVED, Completed, SOURCE_ALIAS_RECORDED, ValueDropped]
    rationale: Structured public identity replaces a raw package URL.
    decision_refs: [D-037]
    tags: [negative, url, package, structured_replacement]

  - id: PRV-024
    categories: [password]
    sink: ordinary_log
    input:
      kind: structured_field
      value:
        field: password
        value: SYNTHETIC_PASSWORD_DO_NOT_USE
    expectation:
      decision: reject
      output: null
      stable_code: PRV_REJECTED_PASSWORD
      prohibited_literals_absent: [SYNTHETIC_PASSWORD_DO_NOT_USE]
      required_literals_present: []
    rationale: Password values are never accepted by a logging sink.
    decision_refs: [D-037, D-053]
    tags: [negative, secret, password]

  - id: PRV-025
    categories: [authentication_token]
    sink: support_export
    input:
      kind: structured_field
      value:
        field: api_token
        value: SYNTHETIC_API_TOKEN_DO_NOT_USE
    expectation:
      decision: reject
      output: null
      stable_code: PRV_REJECTED_AUTHENTICATION_TOKEN
      prohibited_literals_absent: [SYNTHETIC_API_TOKEN_DO_NOT_USE]
      required_literals_present: []
    rationale: Authentication material is absolutely prohibited from support artifacts.
    decision_refs: [D-037, D-053]
    tags: [negative, secret, token, support]

  - id: PRV-026
    categories: [recovery_key]
    sink: workshop_record
    input:
      kind: structured_field
      value:
        field: recovery_key
        value: SYNTHETIC_RECOVERY_KEY_DO_NOT_USE
    expectation:
      decision: reject
      output: null
      stable_code: PRV_REJECTED_RECOVERY_KEY
      prohibited_literals_absent: [SYNTHETIC_RECOVERY_KEY_DO_NOT_USE]
      required_literals_present: []
    rationale: Even the workshop privacy class cannot retain recovery material.
    decision_refs: [D-053]
    tags: [negative, secret, recovery, workshop]

  - id: PRV-027
    categories: [encryption_key]
    sink: local_crash
    input:
      kind: structured_field
      value:
        field: encryption_key
        value: SYNTHETIC_ENCRYPTION_KEY_DO_NOT_USE
    expectation:
      decision: reject
      output: null
      stable_code: PRV_REJECTED_ENCRYPTION_KEY
      prohibited_literals_absent: [SYNTHETIC_ENCRYPTION_KEY_DO_NOT_USE]
      required_literals_present: []
    rationale: Crash handling cannot serialize encryption material.
    decision_refs: [D-037, D-053]
    tags: [negative, secret, encryption, crash]

  - id: PRV-028
    categories: [clipboard_secret]
    sink: task_evidence
    input:
      kind: structured_field
      value:
        field: clipboard_text
        value: SYNTHETIC_CLIPBOARD_SECRET_DO_NOT_USE
    expectation:
      decision: reject
      output: null
      stable_code: PRV_REJECTED_CLIPBOARD_SECRET
      prohibited_literals_absent: [SYNTHETIC_CLIPBOARD_SECRET_DO_NOT_USE]
      required_literals_present: []
    rationale: Clipboard content is not task evidence or ThirdLife-owned data.
    decision_refs: [D-037, D-053]
    tags: [negative, secret, clipboard, evidence]

  - id: PRV-029
    categories: [raw_output, username, personal_path]
    sink: ordinary_log
    input:
      kind: raw_stdout
      value: "SYNTHETIC_TOOL: user=SYNTHETIC_USERNAME path=C:\\Users\\SYNTHETIC_USERNAME\\SYNTHETIC_FILE.txt"
    expectation:
      decision: reject
      output: null
      stable_code: PRV_REJECTED_RAW_STDOUT
      prohibited_literals_absent: [SYNTHETIC_USERNAME, SYNTHETIC_FILE.txt]
      required_literals_present: []
    bounds:
      max_input_utf8_bytes: 4096
    rationale: Raw stdout is never made log-safe by a best-effort substitution pass.
    decision_refs: [D-037]
    tags: [negative, raw_output, stdout, log]

  - id: PRV-030
    categories: [raw_output, package_download_url, url_token]
    sink: support_export
    input:
      kind: raw_stderr
      value: "SYNTHETIC_INSTALLER_ERROR url=https://packages.example.invalid/file?token=SYNTHETIC_TOKEN_DO_NOT_USE"
    expectation:
      decision: replace
      output:
        error_code: PACKAGE_BACKEND_FAILED
        error_category: backend
        recovery_code: RETRY_OR_REVIEW
      stable_code: PRV_REPLACED_RAW_STDERR_WITH_CODE
      prohibited_literals_absent: [packages.example.invalid, SYNTHETIC_TOKEN_DO_NOT_USE, SYNTHETIC_INSTALLER_ERROR]
      required_literals_present: [PACKAGE_BACKEND_FAILED, backend, RETRY_OR_REVIEW]
    bounds:
      max_input_utf8_bytes: 4096
    rationale: A typed stable result replaces untrusted installer stderr.
    decision_refs: [D-037]
    tags: [negative, raw_output, stderr, support, structured_replacement]

  - id: PRV-031
    categories: [raw_provider_report, full_serial, host_identity]
    sink: workshop_record
    input:
      kind: raw_xml
      value: "<syntheticReport host=\"SYNTHETIC-HOSTNAME-DO-NOT-USE\" serial=\"SYNTHETIC-SERIAL-TEST-0001\"/>"
    expectation:
      decision: reject
      output: null
      stable_code: PRV_REJECTED_UNREVIEWED_RAW_REPORT
      prohibited_literals_absent: [SYNTHETIC-HOSTNAME-DO-NOT-USE, SYNTHETIC-SERIAL-TEST-0001]
      required_literals_present: []
    bounds:
      max_input_utf8_bytes: 4096
      max_nesting_depth: 8
    rationale: Raw reports require a provider-specific attachment contract; the general workshop serializer cannot accept them.
    decision_refs: [D-014, D-037]
    tags: [negative, raw_output, xml, workshop]

  - id: PRV-032
    categories: [encoded_blob, raw_output]
    sink: support_export
    input:
      kind: encoded_blob
      value: SYNTHETIC_BASE64_LIKE_BLOB_DO_NOT_DECODE_OR_EXPORT
    expectation:
      decision: reject
      output: null
      stable_code: PRV_REJECTED_ENCODED_BLOB
      prohibited_literals_absent: [SYNTHETIC_BASE64_LIKE_BLOB_DO_NOT_DECODE_OR_EXPORT]
      required_literals_present: []
    bounds:
      max_input_utf8_bytes: 4096
    rationale: Opaque encoding is not a reviewed support field and is not decoded heuristically.
