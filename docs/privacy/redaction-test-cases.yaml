      stable_code: PRV_DROPPED_MAC_ADDRESS
      prohibited_literals_absent: [02-00-00-00-00-01]
      required_literals_present: []
    rationale: A locally administered synthetic MAC still represents a persistent device identifier.
    decision_refs: [D-014, D-037]
    tags: [negative, network, mac, support]

  - id: PRV-016
    categories: [host_identity]
    sink: ordinary_log
    input:
      kind: structured_field
