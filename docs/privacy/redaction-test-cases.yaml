      prohibited_literals_absent: [SYNTHETIC_OPERATOR_ACCOUNT_DO_NOT_USE]
      required_literals_present: []
    rationale: Recipient output does not disclose a workshop operator account.
    decision_refs: [D-014, D-036]
    tags: [negative, operator, recipient]

  - id: PRV-011
    categories: [wifi_identifier]
    sink: ordinary_log
    input:
      kind: structured_field
      value:
        field: wifi_ssid
        value: SYNTHETIC_SSID_DO_NOT_USE
    expectation:
      decision: replace
      output:
        event_code: WIFI_PROFILE_PRESENCE_OBSERVED
        outcome: Completed
        result_code: PRESENT
        redaction_flags: [ValueDropped]
      stable_code: PRV_REPLACED_SSID_WITH_PRESENCE
      prohibited_literals_absent: [SYNTHETIC_SSID_DO_NOT_USE]
      required_literals_present: [WIFI_PROFILE_PRESENCE_OBSERVED, Completed, PRESENT, ValueDropped]
    rationale: The existence of workshop residue may be recorded without the network name.
    decision_refs: [D-037]
    tags: [negative, network, ssid]

  - id: PRV-012
    categories: [wifi_secret, password]
    sink: task_evidence
    input:
      kind: structured_field
      value:
        field: wifi_key
        value: SYNTHETIC_WIFI_PASSWORD_DO_NOT_USE
    expectation:
      decision: reject
      output: null
      stable_code: PRV_REJECTED_WIFI_SECRET
      prohibited_literals_absent: [SYNTHETIC_WIFI_PASSWORD_DO_NOT_USE]
      required_literals_present: []
    rationale: Wi-Fi credentials are never ThirdLife evidence.
    decision_refs: [D-037, D-053]
    tags: [negative, network, secret, evidence]

  - id: PRV-013
    categories: [ip_address]
    sink: support_export
    input:
      kind: structured_field
      value:
        field: ipv4_address
        value: 192.0.2.44
    expectation:
      decision: replace
      output:
        check_id: network_connectivity
        availability: available
      stable_code: PRV_REPLACED_IPV4_WITH_CONNECTIVITY
      prohibited_literals_absent: [192.0.2.44]
      required_literals_present: [network_connectivity, available]
    rationale: Even a reserved test address exercises removal of concrete IP addresses.
    decision_refs: [D-037]
    tags: [negative, network, ipv4, support]

  - id: PRV-014
    categories: [ip_address]
    sink: ordinary_log
    input:
      kind: structured_field
      value:
        field: ipv6_address
        value: 2001:db8::44%SYNTHETIC_ZONE
    expectation:
      decision: replace
      output:
        event_code: IP_FAMILY_OBSERVED
        outcome: Completed
        result_code: IPV6
        redaction_flags: [ValueDropped]
      stable_code: PRV_REPLACED_IPV6_WITH_FAMILY
      prohibited_literals_absent: [2001:db8::44%SYNTHETIC_ZONE, SYNTHETIC_ZONE]
      required_literals_present: [IP_FAMILY_OBSERVED, Completed, IPV6, ValueDropped]
    rationale: Address and interface-zone details are removed while a safe protocol family remains.
    decision_refs: [D-037]
    tags: [negative, network, ipv6, zone]

  - id: PRV-015
    categories: [mac_address, device_identifier]
    sink: support_export
    input:
      kind: structured_field
      value:
        field: mac_address
        value: 02-00-00-00-00-01
    expectation:
      decision: drop
