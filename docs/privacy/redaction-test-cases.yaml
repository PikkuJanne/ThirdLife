      prohibited_literals_absent: [SYNTHETIC_RECIPIENT_NAME_DO_NOT_USE]
      required_literals_present: []
    rationale: Recipient identity is unnecessary for ordinary job logging.
    decision_refs: [D-014, D-037]
    tags: [negative, identity, log]

  - id: PRV-007
    categories: [email_address, recipient_identity]
    sink: support_export
    input:
      kind: structured_field
      value:
        field: recipient_email
        value: synthetic-recipient@example.invalid
    expectation:
      decision: drop
      output: null
      stable_code: PRV_DROPPED_EMAIL_FROM_SUPPORT
      prohibited_literals_absent: [synthetic-recipient@example.invalid]
      required_literals_present: []
    rationale: Support data contains no recipient contact details.
    decision_refs: [D-014, D-037]
    tags: [negative, identity, email, support]

  - id: PRV-008
    categories: [username]
    sink: ordinary_log
    input:
      kind: structured_field
      value:
        field: local_username
        value: SYNTHETIC_LOCAL_USERNAME_DO_NOT_USE
    expectation:
      decision: replace
      output:
        event_code: ACCOUNT_PRESENCE_OBSERVED
        outcome: Completed
        result_code: PRESENT
        redaction_flags: [ValueDropped]
      stable_code: PRV_REPLACED_USERNAME_WITH_PRESENCE
      prohibited_literals_absent: [SYNTHETIC_LOCAL_USERNAME_DO_NOT_USE]
      required_literals_present: [ACCOUNT_PRESENCE_OBSERVED, Completed, PRESENT, ValueDropped]
    rationale: Logs may record a bounded finding state but not the account name.
    decision_refs: [D-014, D-037]
    tags: [negative, username, structured_replacement]

  - id: PRV-009
    categories: [security_identifier, username]
    sink: support_export
    input:
      kind: structured_field
      value:
        field: account_sid
        value: SYNTHETIC_SID_DO_NOT_USE
    expectation:
      decision: drop
      output: null
      stable_code: PRV_DROPPED_ACCOUNT_IDENTIFIER
      prohibited_literals_absent: [SYNTHETIC_SID_DO_NOT_USE]
      required_literals_present: []
    rationale: An operating-system account identifier is linkable and not support-allowlisted.
    decision_refs: [D-014, D-037]
    tags: [negative, account, support]

  - id: PRV-010
    categories: [operator_identity]
    sink: recipient_guide
    input:
      kind: structured_field
      value:
