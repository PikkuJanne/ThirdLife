schema_version: 1
model_revision: TL-0005 draft 1
fixture_type: synthetic privacy redaction cases
privacy_owner_approval: Approved

expectation_output_contract:
  ordinary_log: exact registered safe-field fragment before required closed-envelope assembly
  support_export: exact allowlisted normalized projection fragment before bundle-manifest assembly
  all_other_sinks: exact post-classification sink decision output

synthetic_value_policy:
  reserved_markers:
    - SYNTHETIC_
    - example.invalid
  documentation_network_ranges:
    - 192.0.2.0/24
    - 2001:db8::/32
  requirements:
    - Inputs are invented test values and never copied from a person, device, account, or local machine.
    - Secret-like inputs use conspicuous DO_NOT_USE markers rather than real credential formats.
    - External-product cases are generic and contain no sibling product identifier or behavior.

decision_vocabulary:
  - allow
  - replace
  - drop
  - reject

sink_vocabulary:
  - workshop_record
  - ordinary_log
  - support_export
  - recipient_guide
  - local_crash
  - ui_error
  - task_evidence
  - telemetry

category_vocabulary:
  - recipient_identity_absent
  - full_serial
  - recipient_identity
  - email_address
  - username
  - security_identifier
  - operator_identity
  - wifi_identifier
  - wifi_secret
  - ip_address
  - mac_address
  - host_identity
  - personal_path
  - network_path
  - file_uri
  - environment_path
  - package_download_url
  - url_credential
  - url_token
  - password
  - product_key
  - authentication_token
  - recovery_key
  - encryption_key
  - clipboard_secret
  - raw_output
  - raw_provider_report
  - encoded_blob
  - exception_text
  - stack_trace
  - nested_sensitive_value
  - duplicate_key
  - unicode_normalization
  - zero_width_character
  - homoglyph
  - bidi_control
  - control_character
  - log_injection
  - markup_injection
  - formula_injection
  - oversized_input
  - oversized_collection
  - excessive_depth
  - external_private_database
  - external_private_content
  - external_recovery_credential
  - telemetry
  - device_identifier
  - public_package_metadata
  - os_version
  - native_error_code
  - generic_hardware
  - public_update_identity
  - logical_manifest_name
  - correlation_id
  - support_id
  - recipient_choice_status
  - unknown_classification
  - hashed_identifier
  - export_destination
  - destination_category
  - stable_result_code

cases:
  - id: PRV-001
    categories: [recipient_identity_absent]
    sink: workshop_record
    input:
      kind: structured_record
      value:
        job_id: SYNTHETIC_JOB_0001
        device_state: ready_for_assessment
    expectation:
      decision: allow
      output:
        job_id: SYNTHETIC_JOB_0001
        device_state: ready_for_assessment
      stable_code: PRV_ALLOWED_RECIPIENTLESS_JOB
      prohibited_literals_absent: []
      required_literals_present: [SYNTHETIC_JOB_0001, ready_for_assessment]
    rationale: A normal workshop job succeeds without a recipient name or contact field.
    decision_refs: [D-014]
    tags: [positive, recipientless, workshop]

  - id: PRV-002
    categories: [full_serial]
    sink: workshop_record
    input:
      kind: structured_field
      value:
        field: device_serial
        value: SYNTHETIC-SERIAL-TEST-0001
    expectation:
      decision: allow
      output:
        field: device_serial
        value: SYNTHETIC-SERIAL-TEST-0001
      stable_code: PRV_ALLOWED_WORKSHOP_SERIAL
      prohibited_literals_absent: []
      required_literals_present: [SYNTHETIC-SERIAL-TEST-0001]
    rationale: A full serial is permitted only in the workshop privacy class.
    decision_refs: [D-014, D-036]
    tags: [positive, serial, workshop_only]

  - id: PRV-003
    categories: [full_serial]
    sink: ordinary_log
    input:
      kind: structured_field
      value:
        field: device_serial
        value: SYNTHETIC-SERIAL-TEST-0001
    expectation:
      decision: drop
      output: null
      stable_code: PRV_DROPPED_SERIAL_FROM_LOG
      prohibited_literals_absent: [SYNTHETIC-SERIAL-TEST-0001]
      required_literals_present: []
    rationale: Ordinary diagnostics never persist a full serial.
    decision_refs: [D-014, D-037]
    tags: [negative, serial, log]

  - id: PRV-004
    categories: [full_serial]
    sink: support_export
    input:
      kind: structured_field
      value:
        field: device_serial
        value: SYNTHETIC-SERIAL-TEST-0001
    expectation:
      decision: drop
      output: null
      stable_code: PRV_DROPPED_SERIAL_FROM_SUPPORT
      prohibited_literals_absent: [SYNTHETIC-SERIAL-TEST-0001]
      required_literals_present: []
    rationale: The initial support allowlist omits full serials rather than hashing them.
    decision_refs: [D-014, D-036, D-037]
    tags: [negative, serial, support]

  - id: PRV-005
    categories: [full_serial]
    sink: recipient_guide
    input:
      kind: structured_field
      value:
        field: device_serial
        value: SYNTHETIC-SERIAL-TEST-0001
    expectation:
      decision: drop
      output: null
      stable_code: PRV_DROPPED_SERIAL_FROM_GUIDE
      prohibited_literals_absent: [SYNTHETIC-SERIAL-TEST-0001]
      required_literals_present: []
    rationale: A recipient guide does not need a full device identifier.
    decision_refs: [D-014, D-036]
    tags: [negative, serial, recipient]

  - id: PRV-006
    categories: [recipient_identity]
    sink: ordinary_log
    input:
      kind: structured_field
      value:
        field: recipient_name
        value: SYNTHETIC_RECIPIENT_NAME_DO_NOT_USE
    expectation:
      decision: drop
